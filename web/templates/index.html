<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four in a Row</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">🔴</div>
        <h1>Four in a Row</h1>
        <p class="tagline">Drop discs into columns — connect four to win</p>
      </header>

      <section class="card status-card" aria-live="polite">
        <p id="turn-text" class="turn-text">X's turn</p>
        <p id="result-text" class="result-text" hidden></p>
        <p id="error-text" class="error" role="alert" hidden></p>
        <button type="button" id="btn-new" class="btn btn-secondary">New game</button>
      </section>

      <section class="board-wrap" aria-label="Game board">
        <div class="board" id="board">
          {% for row in range(board_height) %}
          <div class="board-row">
            {% for col in range(board_width) %}
            <div
              class="cell"
              data-col="{{ col }}"
              data-row="{{ row }}"
              aria-label="Column {{ col + 1 }}, row {{ row + 1 }}"
            ></div>
            {% endfor %}
          </div>
          {% endfor %}
        </div>
        <div class="column-buttons" id="column-buttons">
          {% for col in range(1, board_width + 1) %}
          <button type="button" class="col-btn" data-column="{{ col }}" aria-label="Drop in column {{ col }}">
            {{ col }}
          </button>
          {% endfor %}
        </div>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
